# CI for polygloss. macOS arm64 only (ADR-0016, OQ-P9). Every cargo call goes
# through scripts/cargo.sh, which runs rustup's cargo from ~/.cargo/bin.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Format check and lint
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      # rustup >= 1.28 no longer installs the toolchain on `rustup show`; with no
      # argument, `toolchain install` installs the one rust-toolchain.toml pins.
      - run: rustup toolchain install
      - run: rustup show
      # scripts/cargo.sh keeps build intermediates in target-shared (build.build-dir)
      # and only final artifacts in target/, so cache the former.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target-shared"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-deny
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: bun run format:check && bun run lint

  unit:
    name: Rust unit and integration tests
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      # rustup >= 1.28 no longer installs the toolchain on `rustup show`; with no
      # argument, `toolchain install` installs the one rust-toolchain.toml pins.
      - run: rustup toolchain install
      - run: rustup show
      # scripts/cargo.sh keeps build intermediates in target-shared (build.build-dir)
      # and only final artifacts in target/, so cache the former.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target-shared"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-deny
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: scripts/cargo.sh nextest run --workspace --no-tests=warn --profile ci

  bun:
    name: Bun suites
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      # rustup >= 1.28 no longer installs the toolchain on `rustup show`; with no
      # argument, `toolchain install` installs the one rust-toolchain.toml pins.
      - run: rustup toolchain install
      - run: rustup show
      # scripts/cargo.sh keeps build intermediates in target-shared (build.build-dir)
      # and only final artifacts in target/, so cache the former.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target-shared"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-deny
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: bun test

  e2e:
    name: End-to-end
    runs-on: macos-15
    timeout-minutes: 90
    # Built with a release version, as release.yml builds: the E2E suites
    # then check that it reaches both executables and the app's socket
    # (tests/e2e/version.test.ts; ADR-0019).
    env:
      POLYGLOSS_VERSION: "20261005.1"
    steps:
      - uses: actions/checkout@v7
      # rustup >= 1.28 no longer installs the toolchain on `rustup show`; with no
      # argument, `toolchain install` installs the one rust-toolchain.toml pins.
      - run: rustup toolchain install
      - run: rustup show
      # scripts/cargo.sh keeps build intermediates in target-shared (build.build-dir)
      # and only final artifacts in target/, so cache the former.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target-shared"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-deny
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: bun run test:e2e

  audit:
    name: Dependency audit
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # rustup >= 1.28 no longer installs the toolchain on `rustup show`; with no
      # argument, `toolchain install` installs the one rust-toolchain.toml pins.
      - run: rustup toolchain install
      - run: rustup show
      # scripts/cargo.sh keeps build intermediates in target-shared (build.build-dir)
      # and only final artifacts in target/, so cache the former.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target-shared"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-deny
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      # Crate rules (check-deps), licenses and advisories (cargo-deny), and the
      # bundled third-party notices match the dependency graph (plan T5.7).
      - run: scripts/check-deps.sh && scripts/cargo.sh deny check licenses bans sources advisories && bun scripts/third-party-notices.ts --check

  # Every push to main whose jobs all pass is released (ADR-0019,
  # .github/workflows/release.yml). The only job with write access.
  release:
    name: Release
    needs: [lint, unit, bun, e2e, audit]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    secrets: inherit
