# Nightly checks for polygloss. macOS arm64 only (ADR-0016, OQ-P9). Every cargo
# call goes through scripts/cargo.sh, which runs rustup's cargo from ~/.cargo/bin.
#
# git-parity (plan T1.16, design §6.3): our hunks vs `git diff` on seeded parity
# repos. linux-parity (plan T2.1): the same check on the Linux corpus
# (v6.10..v6.11, compared --direct). perf (plan T2.9, design §12): the perf
# matrix over all four corpora in both layouts, compared with the baseline
# recorded for this runner class (budgets are gated on the developer's machine,
# OQ-P9); until benches/baseline.json has one, it records a candidate.
name: nightly

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  git-parity:
    name: Git parity (seed ${{ matrix.seed }})
    runs-on: macos-15
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        seed: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v7
      # rustup >= 1.28 no longer installs the toolchain on `rustup show`; with no
      # argument, `toolchain install` installs the one rust-toolchain.toml pins.
      - run: rustup toolchain install
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target-shared"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: scripts/cargo.sh build --release -p polygloss-cli
      - run: bun scripts/make-parity-repo.ts --seed ${{ matrix.seed }} --files 500 --out "$RUNNER_TEMP/parity-repo"
      - run: bun scripts/git-parity.ts --repo "$RUNNER_TEMP/parity-repo" --range parity-base..parity-head --min-rate 0.999 --mismatches-dir "$RUNNER_TEMP/parity-mismatches"
        env:
          POLYGLOSS_CLI_BIN: target/release/polygloss-cli
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: git-parity-mismatches-seed-${{ matrix.seed }}
          path: ${{ runner.temp }}/parity-mismatches
          if-no-files-found: ignore

  linux-parity:
    name: Git parity (Linux v6.10..v6.11)
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target-shared"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: scripts/cargo.sh build --release -p polygloss-cli
      # Two depth-1 tag fetches from the GitHub mirror (the only network use;
      # the app and CLI never fetch). No checkout: parity reads trees.
      - name: Fetch the Linux corpus
        run: benches/corpora/fetch-linux.sh
        env:
          POLYGLOSS_CORPORA: ${{ runner.temp }}/corpora
      - name: Parity on v6.10..v6.11
        run: bun scripts/git-parity.ts --corpus linux --min-rate 0.999 --mismatches-dir "$RUNNER_TEMP/parity-mismatches"
        env:
          POLYGLOSS_CORPORA: ${{ runner.temp }}/corpora
          POLYGLOSS_CLI_BIN: target/release/polygloss-cli
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: git-parity-mismatches-linux
          path: ${{ runner.temp }}/parity-mismatches
          if-no-files-found: ignore

  perf:
    name: Perf (design §12 corpora)
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target-shared"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      # run-perf.ts launches both runners' binaries: polygloss-perf and the
      # app (its app-open, watcher-banner, comment-roundtrip and motion
      # scenarios). One package per build, as its --build does, so their
      # features are not unified.
      - run: scripts/cargo.sh build --profile perf -p polygloss-perf
      - run: scripts/cargo.sh build --profile perf -p polygloss-app
      # Generated corpora are deterministic; the Linux corpus is two depth-1
      # tag fetches (the only network use; the app and CLI never fetch).
      - name: Make the corpora
        run: |
          bun benches/corpora/make-typical.ts
          bun benches/corpora/make-synthetic.ts
          bun benches/corpora/make-huge-file.ts
          benches/corpora/fetch-linux.sh
        env:
          POLYGLOSS_CORPORA: ${{ runner.temp }}/corpora
      # Headed GPUI windows on the runner's desktop session. run-perf.ts finds
      # its baseline entry by CPU, and with none it compares nothing and
      # passes. So when benches/baseline.json has no entry for this runner's
      # CPU, the run records one instead (benches/results/baseline.json in the
      # perf-results artifact, starting from the committed file) and warns;
      # committing that file makes later runs compare.
      - name: Run the perf matrix
        run: |
          cpu="$(sysctl -n machdep.cpu.brand_string)"
          if jq -e --arg cpu "$cpu" 'any(.entries[]; .machine.cpu == $cpu)' benches/baseline.json > /dev/null; then
            bun benches/run-perf.ts --corpus all --layouts split,unified --compare-baseline
          else
            echo "::warning title=No perf baseline for this runner::benches/baseline.json has no entry for $cpu, so nothing was compared; this run records one in benches/results/baseline.json (perf-results artifact): commit it to compare from then on"
            mkdir -p benches/results
            cp benches/baseline.json benches/results/baseline.json
            bun benches/run-perf.ts --corpus all --layouts split,unified --write-baseline --baseline benches/results/baseline.json
          fi
        env:
          POLYGLOSS_CORPORA: ${{ runner.temp }}/corpora
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: perf-results
          path: benches/results
          if-no-files-found: ignore
