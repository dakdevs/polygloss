[package]
name = "polygloss-app"
description = "Polygloss: native macOS diff reviewer (GPUI app)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
default-run = "Polygloss"

# The app's modules live in the library so the `app` and `e2e` integration
# test binaries can reach them; `src/main.rs` is only the entry point.
[lib]
name = "polygloss_app"
path = "src/lib.rs"

[[bin]]
name = "Polygloss"
path = "src/main.rs"

# GPUI E2E and screenshot suites (tests/e2e/main.rs). `harness = false`: GPUI's
# real macOS text system can only be created on the main thread, where libtest
# never runs tests, so the binary brings a small libtest-compatible runner
# (tests/support/harness.rs) that nextest drives like any test binary.
[[test]]
name = "e2e"
path = "tests/e2e/main.rs"
harness = false
required-features = ["e2e"]

[features]
# Gates the `e2e` integration test binary (GPUI E2E and screenshot suites,
# tests/e2e/main.rs); scripts/test-e2e.sh runs it.
e2e = []

# cargo-packager 0.11.8 (library-choices §13, plan T5.1), run by
# scripts/package-release.sh: it builds `Polygloss` and `polygloss-cli` with one
# `-p` each first (a joint build would unify features and link
# polygloss-platform's `appkit` into the CLI, so there is no
# before-packaging-command), cargo-packager lays out the .app, and the script
# stamps CFBundleVersion, signs and makes the DMG itself. No signing identity
# here: signing is env-only (scripts/sign-and-notarize.sh, T5.2). Relative
# paths are from this crate's directory.
[package.metadata.packager]
product-name = "Polygloss"
identifier = "dev.dak.polygloss"
category = "DeveloperTool"
formats = ["app"]
out-dir = "../../dist"
binaries = [{ path = "Polygloss", main = true }, { path = "polygloss-cli" }]
icons = ["../../packaging/icon.icns"]
deep-link-protocols = [{ schemes = ["polygloss"], role = "viewer" }]

[package.metadata.packager.macos]
minimum-system-version = "14.0"
entitlements = "../../packaging/entitlements.plist"
info-plist-path = "../../packaging/Info.plist"

[dependencies]
polygloss-core.workspace = true
polygloss-diff.workspace = true
polygloss-highlight.workspace = true
polygloss-viewport.workspace = true
polygloss-platform = { workspace = true, features = ["appkit"] }
gpui-kit.workspace = true
nucleo-matcher.workspace = true
notify.workspace = true
notify-debouncer-full.workspace = true
futures.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
# Process start time (`proc_pidinfo`) and max RSS for `--perf-scenario`.
libc.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
regex.workspace = true
# Comment bodies: the sanitizer's pre-pass parses them as gpui-kit's
# TextView does (markdown-rs, same version).
markdown.workspace = true
# The perf scenarios' private data dir.
tempfile.workspace = true

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
# `testing::{Sandbox, FixtureRepo}` for the test binaries.
polygloss-core = { workspace = true, features = ["test-support"] }
# `polygloss_diff::testing`: the scaling checks of the timing tests.
polygloss-diff = { workspace = true, features = ["test-support"] }
# The tests read `DiffViewport::debug()`.
polygloss-viewport = { workspace = true, features = ["debug-inspect"] }
image.workspace = true
insta.workspace = true
