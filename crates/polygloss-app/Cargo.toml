[package]
name = "polygloss-app"
description = "Polygloss: native macOS diff reviewer (GPUI app)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
default-run = "Polygloss"

[[bin]]
name = "Polygloss"
path = "src/main.rs"

[[test]]
name = "e2e"
path = "tests/e2e/main.rs"
required-features = ["e2e"]

[features]
# Gates the `e2e` integration test binary (GPUI E2E and screenshot suites,
# tests/e2e/main.rs from T2.8); scripts/test-e2e.sh runs it.
e2e = []

[dependencies]
polygloss-core.workspace = true
polygloss-diff.workspace = true
polygloss-highlight.workspace = true
polygloss-viewport.workspace = true
polygloss-platform = { workspace = true, features = ["appkit"] }
gpui-kit.workspace = true
nucleo-matcher.workspace = true
notify.workspace = true
notify-debouncer-full.workspace = true
futures.workspace = true
anyhow.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
regex.workspace = true

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
insta.workspace = true
tempfile.workspace = true
