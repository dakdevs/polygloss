[package]
name = "polygloss-app"
description = "Polygloss: native macOS diff reviewer (GPUI app)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
default-run = "Polygloss"

# The app's modules live in the library so the `app` and `e2e` integration
# test binaries can reach them; `src/main.rs` is only the entry point.
[lib]
name = "polygloss_app"
path = "src/lib.rs"

[[bin]]
name = "Polygloss"
path = "src/main.rs"

# GPUI E2E and screenshot suites (tests/e2e/main.rs). `harness = false`: GPUI's
# real macOS text system can only be created on the main thread, where libtest
# never runs tests, so the binary brings a small libtest-compatible runner
# (tests/support/harness.rs) that nextest drives like any test binary.
[[test]]
name = "e2e"
path = "tests/e2e/main.rs"
harness = false
required-features = ["e2e"]

[features]
# Gates the `e2e` integration test binary (GPUI E2E and screenshot suites,
# tests/e2e/main.rs); scripts/test-e2e.sh runs it.
e2e = []

[dependencies]
polygloss-core.workspace = true
polygloss-diff.workspace = true
polygloss-highlight.workspace = true
polygloss-viewport.workspace = true
polygloss-platform = { workspace = true, features = ["appkit"] }
gpui-kit.workspace = true
nucleo-matcher.workspace = true
notify.workspace = true
notify-debouncer-full.workspace = true
futures.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
# Process start time (`proc_pidinfo`) and max RSS for `--perf-scenario`.
libc.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
regex.workspace = true
# The perf scenarios' private data dir.
tempfile.workspace = true

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
# `testing::{Sandbox, FixtureRepo}` for the test binaries.
polygloss-core = { workspace = true, features = ["test-support"] }
# The tests read `DiffViewport::debug()`.
polygloss-viewport = { workspace = true, features = ["debug-inspect"] }
image.workspace = true
insta.workspace = true
