[package]
name = "polygloss-platform"
description = "Polygloss macOS glue: launch, Dock badge, Sparkle, editor detection, CLI install (no GPUI)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
appkit = ["dep:objc2", "dep:objc2-foundation", "dep:objc2-app-kit"]

[dependencies]
# `DataPaths` and the socket path rule (`ipc::socket_path`) for the launch
# helper (T4.2). Core links no GPUI or tokio either.
polygloss-core.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { workspace = true, optional = true }
# `NSNotification` and `NSWorkspace`/`NSAccessibility`: the live Reduce
# Motion observer (T7.16), on top of the workspace's features.
objc2-foundation = { workspace = true, optional = true, features = ["NSNotification"] }
objc2-app-kit = { workspace = true, optional = true, features = ["NSWorkspace", "NSAccessibility"] }

[dev-dependencies]
# Temp dirs for the editor tests' fake shims, bundles and scratch files.
tempfile.workspace = true
# The launch tests check the socket fallback's name (sha256 of the data dir).
sha2.workspace = true
hex.workspace = true

# Bundle detection and the Dock badge need the objc2 FFI.
[[test]]
name = "appkit"
required-features = ["appkit"]

# The Sparkle loader is objc2 FFI too (T5.3).
[[test]]
name = "sparkle"
required-features = ["appkit"]

# The live Reduce Motion observer is objc2 FFI too (T7.16).
[[test]]
name = "reduce_motion"
required-features = ["appkit"]
