[package]
name = "polygloss-diff"
description = "Polygloss diff model: hunks, word diff, line mapping and row model (no git, IO or GPUI)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# Final for M1 (T1.1): later M1 tasks add code, never dependencies. Ownership:
# gix-imara-diff, serde, thiserror. The leaf crate: no git, IO, SQLite or GPUI.
[dependencies]
gix-imara-diff.workspace = true
serde.workspace = true
thiserror.workspace = true

[features]
# `polygloss_diff::testing`: scaling checks for this crate's and other crates'
# tests. Never enabled by shipping binaries.
test-support = []

# tempfile: the git-parity tests run `git diff --no-index` under a temp HOME and an
# empty GIT_CONFIG_GLOBAL (plan "Test hygiene").
[dev-dependencies]
# The crate lists itself so its own integration tests get `testing`.
polygloss-diff = { path = ".", features = ["test-support"] }
insta.workspace = true
criterion.workspace = true
tempfile.workspace = true
serde_json.workspace = true

[[bench]]
name = "hunks"
harness = false

[[bench]]
name = "word"
harness = false

[[bench]]
name = "line_map"
harness = false
