[package]
name = "polygloss-highlight"
description = "Polygloss syntax highlighting: lumis adapter, compact tokens, Zed-format themes (no GPUI)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
lumis.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
insta.workspace = true
criterion.workspace = true
# `polygloss_diff::testing`: the scaling checks of the timing tests.
polygloss-diff = { workspace = true, features = ["test-support"] }

# One integration test binary (`tests/highlight/main.rs`, one module per area):
# every test binary links all lumis grammars, so fewer binaries save link time
# and disk.

[[bench]]
name = "highlight"
harness = false
