      <stop offset="0" stop-color="#4c9dff"/>
      <stop offset="1" stop-color="#2f7cf6"/>
    </linearGradient>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="100.5" y="100.5" width="823" height="823" rx="184.5" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>

  <!-- context line -->
  <rect x="196" y="224" width="456" height="56" rx="28" fill="#6b7280"/>

  <!-- deleted line -->
  <rect x="172" y="324" width="680" height="120" rx="32" fill="#ff5f56" fill-opacity="0.22"/>
  <rect x="204" y="370" width="72" height="28" rx="8" fill="#ff6b61"/>
  <rect x="308" y="356" width="400" height="56" rx="28" fill="#ff6b61"/>

