<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Polygloss app icon, flat (scripts/make-icon.sh renders packaging/icon.icns from it).
       A diff and its gloss: a short deleted line, the added line twice its length, and a
       review note whose pointed corner rests over the added line. Body: the macOS 26
       squircle (824, continuous corners) at +100+100. Every straight edge sits on the
       64-unit grid, i.e. whole pixels at 16 px. packaging/AppIcon.icon draws the same
       paths as Icon Composer layers (scripts/package-release.sh compiles it). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="100" x2="0" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e9e9e7"/>
    </linearGradient>
    <linearGradient id="deleted-fill" x1="0" y1="448" x2="0" y2="576" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ea807b"/>
      <stop offset="1" stop-color="#d75a55"/>
    </linearGradient>
    <linearGradient id="added-fill" x1="0" y1="640" x2="0" y2="768" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#79c97d"/>
      <stop offset="1" stop-color="#52b056"/>
    </linearGradient>
    <linearGradient id="gloss-fill" x1="0" y1="256" x2="0" y2="576" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5581de"/>
      <stop offset="1" stop-color="#275cc9"/>
    </linearGradient>
  </defs>
  <path d="M512 100C732.5 100 792.5 94.19 861.15 162.85C929.81 231.5 924 291.5 924 512C924 732.5 929.81 792.5 861.15 861.15C792.5 929.81 732.5 924 512 924C291.5 924 231.5 929.81 162.85 861.15C94.19 792.5 100 732.5 100 512C100 291.5 94.19 231.5 162.85 162.85C231.5 94.19 291.5 100 512 100Z" fill="url(#bg)"/>
